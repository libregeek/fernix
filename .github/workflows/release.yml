name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive          # TagLib and its utfcpp
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Accept the Android SDK licences
        run: |
          # Written by hand, so this does not depend on sdkmanager; Gradle then installs what it needs.
          mkdir -p "$ANDROID_HOME/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
      - name: Install the NDK and CMake (best effort)
        continue-on-error: true
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --install "ndk;28.2.13676358" "cmake;3.31.6" || echo "sdkmanager could not install them; Gradle will try"
          "$SDKMANAGER" --list_installed || true
      - name: Build
        run: ./gradlew assembleRelease
      - name: No INTERNET permission
        run: "! grep -R '<uses-permission[^>]*android.permission.INTERNET' app/build/intermediates/merged_manifest/"
      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "Using $BT"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          $BT/zipalign -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          $BT/apksigner sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
                                                                                        --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
                                                                                        --out "fernix-${GITHUB_REF_NAME}.apk" "$RUNNER_TEMP/aligned.apk"
                                                                                        $BT/apksigner verify --print-certs "fernix-${GITHUB_REF_NAME}.apk"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: fernix-*.apk
          generate_release_notes: true
