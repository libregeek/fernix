name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive          # TagLib and its utfcpp
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK pieces
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "ndk;28.2.13676358" "cmake;3.31.6" "build-tools;36.0.0" "platforms;android-37"
      - name: Build
        run: ./gradlew assembleRelease
      - name: No INTERNET permission
        run: "! grep -R '<uses-permission[^>]*android.permission.INTERNET' app/build/intermediates/merged_manifest/"
      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BT=$ANDROID_HOME/build-tools/36.0.0
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          $BT/zipalign -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          $BT/apksigner sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
                                                                                        --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
                                                                                        --out "fernix-${GITHUB_REF_NAME}.apk" "$RUNNER_TEMP/aligned.apk"
                                                                                        $BT/apksigner verify --print-certs "fernix-${GITHUB_REF_NAME}.apk"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: fernix-*.apk
          generate_release_notes: true
